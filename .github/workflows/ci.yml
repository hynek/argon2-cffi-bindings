---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: "1" # Make tools pretty.
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_NO_PYTHON_VERSION_WARNING: 1
  SETUPTOOLS_SCM_PRETEND_VERSION: "1.0" # avoid warnings about shallow checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    env:
      BUILD_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp
        with:
          include-free-threaded: 'true'
          python-version:  ${{ env.BUILD_PYTHON }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          python-version: ${{ env.BUILD_PYTHON }}

      # Smoke-check the wheel against argon2-cffi.
      - run: python -Im pip install $DIST/*.whl
        env:
          DIST: ${{ steps.baipp.outputs.dist }}
      - run: python -Im pip install --no-deps git+https://github.com/hynek/argon2-cffi.git
      - run: python -Im argon2 -n 1 -t 1 -m 8 -p 1

    outputs:
      # Used to define the matrix for tests below. The value is based on
      # packaging metadata (trove classifiers).
      python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}

  tests:
    name: Tests on ${{ matrix.python-version }}
    needs: build-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Created by the build-and-inspect-python-package action above.
        python-version: ${{ fromJson(needs.build-package.outputs.python-versions) }}
    env:
      PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - run: python -Im pip install tox
      - run: python -Im tox run -e $PYTHON

  abi3t-wheel:
    name: abi3t cross-test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # A cross-section of the platforms we build 3.15 wheels for.
        # On Linux, tests both libcs and riscv64. Uses the cibuildwheel images.
        # Windows and macOS use setup-python.
        include:
          - name: manylinux_x86_64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64@sha256:db817cd4c670f1191d74db6a94a0b115954af78861db7da660de4e93ebf2984c # 2026.08.04-1
          - name: musllinux_x86_64
            os: ubuntu-latest
            container: quay.io/pypa/musllinux_1_2_x86_64@sha256:f130bd3e3aebb39abcdec28a89f987f0d31b52d74bac5852318303698e9a5033 # 2026.08.04-1
          - name: manylinux_riscv64
            os: ubuntu-24.04-riscv
            container: quay.io/pypa/manylinux_2_39_riscv64@sha256:41197d59628c256b0fde14a5dd5bb306e17665c515a8385e43cc72c1da1d7866 # 2026.08.04-1
          - name: windows-latest
            os: windows-latest
          - name: windows-11-arm
            os: windows-11-arm
          - name: macos-latest
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python-ft
        if: ${{ !matrix.container }}
        with:
          python-version: 3.15t
          allow-prereleases: true
          cache: pip
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python-gil
        if: ${{ !matrix.container }}
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Pick the interpreters
        shell: bash
        env:
          IN_CONTAINER: ${{ matrix.container && 'yes' || '' }}
          SETUP_FT: ${{ steps.python-ft.outputs.python-path }}
          SETUP_GIL: ${{ steps.python-gil.outputs.python-path }}
        run: |
          if [[ -n "$IN_CONTAINER" ]]; then
            echo "FT_PYTHON=/opt/python/cp315-cp315t/bin/python" >>"$GITHUB_ENV"
            echo "GIL_PYTHON=/opt/python/cp315-cp315/bin/python" >>"$GITHUB_ENV"
          else
            echo "FT_PYTHON=$SETUP_FT" >>"$GITHUB_ENV"
            echo "GIL_PYTHON=$SETUP_GIL" >>"$GITHUB_ENV"
          fi

      - name: Build a wheel on free-threaded Python
        shell: bash
        run: |
          "$FT_PYTHON" -Im pip install build
          "$FT_PYTHON" -Im build --wheel

      - name: Ensure the wheel targets the free-threaded stable ABI
        shell: bash
        run: |
          ls dist/
          test -e dist/*-cp315-abi3.abi3t-*.whl

      - name: Test the wheel on free-threaded Python
        shell: bash
        run: |
          "$FT_PYTHON" -Im pip install dist/*.whl pytest
          "$FT_PYTHON" -Im pytest

      - name: Test the same wheel on GIL Python
        shell: bash
        run: |
          "$GIL_PYTHON" -Im pip install dist/*.whl pytest
          "$GIL_PYTHON" -Im pytest

  tests-pypy:
    name: Tests against latest PyPy
    runs-on: ubuntu-latest
    env:
      PYTHON: pypy3.11

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON }}
          allow-prereleases: true
          cache: pip
      - run: python -Im pip install tox
      - run: python -Im tox run -e $PYTHON

  system-package:
    runs-on: ubuntu-latest
    name: Install and test with system package of Argon2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version-default
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get install libargon2-1 libargon2-dev
          # Ensure we cannot use our own Argon2 by accident.
          rm -rf extras
      - run: python -Im pip install tox
      - run: python -Im tox run -e system-argon2

  install-dev:
    name: Verify dev env
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version-default
      - run: python -Im pip install -e . --group dev

      - name: Import package
        run: python -c 'from _argon2_cffi_bindings import ffi, lib; print(lib.ARGON2_VERSION_NUMBER)'
      - run: otool -L "$(python -c 'import _argon2_cffi_bindings._ffi as m; print(m.__file__)')"
        if: startsWith(matrix.os , 'macos')
      - run: ldd "$(python -c 'import _argon2_cffi_bindings._ffi as m; print(m.__file__)')"
        if: startsWith(matrix.os , 'ubuntu')

      - name: Check presence of pytest
        run: pytest --version

  cog-check:
    name: Ensure cogified files are up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          python-version: "3.x"

      - run: python -Im pip install tox

      - run: python -Im tox run -e cog-check

  gen-check:
    name: Ensure the generated CFFI source is up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          python-version: "3.x"

      - run: python -Im pip install tox

      - run: python -Im tox run -e gen-check

  required-checks-pass:
    name: Ensure everything required is passing for branch protection
    if: always()

    needs:
      - build-package
      - tests
      - abi3t-wheel
      - tests-pypy
      - install-dev
      - system-package
      - cog-check
      - gen-check

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
