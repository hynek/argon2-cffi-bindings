[tox]
min_version = 4.25
env_list =
    pre-commit,
    cog-{check,render},
    gen-check,
    3.{10-15},
    3.1{4-5}t,
    pypy3.{10-11},
    system-argon2


[testenv:pre-commit]
description = Run all pre-commit hooks.
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files


[testenv:cog-render]
description = Update README and CHANGELOG
skip_install = true
deps = cogapp>=3.3.0
commands = cog -rP README.md CHANGELOG.md


[testenv:cog-check]
description = Ensure README and CHANGELOG are up-to-date
skip_install = true
deps = {[testenv:cog-render]deps}
commands = cog --check -P README.md CHANGELOG.md


[testenv:gen]
description = Regenerate the committed CFFI C source from the FFI definition.
skip_install = true
dependency_groups =
# cffi-gen-src needs CFFI 2.1+, which PyPy can't provide, so this runs on
# CPython. Pin CFFI so the generated output is reproducible; bump deliberately.
base_python = python3
deps = cffi==2.1.0
commands =
    python -m cffi.gen_src read-sources _argon2_cffi_bindings._ffi \
        src/_argon2_cffi_bindings/_ffi.cdef.txt \
        src/_argon2_cffi_bindings/_ffi.csrc.c \
        src/_argon2_cffi_bindings/_ffi.c


[testenv:gen-check]
description = Ensure the committed CFFI C source is up-to-date.
skip_install = true
dependency_groups =
base_python = {[testenv:gen]base_python}
deps = {[testenv:gen]deps}
allowlist_externals = git
commands =
    {[testenv:gen]commands}
    git diff --exit-code -- src/_argon2_cffi_bindings/_ffi.c


[testenv]
description = Run tests.
dependency_groups = tests
commands = pytest {posargs}


[testenv:system-argon2]
description = Run tests against bindings that use a system installation of Argon2.
set_env = ARGON2_CFFI_USE_SYSTEM=1
dependency_groups = tests
install_command = pip install {opts} --no-binary=argon2-cffi-bindings {packages}


[testenv:clean]
description = Remove build artifacts.
allowlist_externals = rm
skip_install = true
dependency_groups =
commands = rm -rf .tox build src/argon2_cffi_bindings.egg-info wheelhouse default.profraw
